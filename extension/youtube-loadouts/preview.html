<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loadoutize extension preview</title>
    <link rel="stylesheet" href="content.css">
    <style>
      body { margin: 0; background: #0f0f0f; color: #f1f1f1; font: 20px Arial, sans-serif; }
      main { width: min(720px, calc(100% - 32px)); margin: 64px auto; }
      .video-title { font-size: 20px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="video-title">Best MW4 weapon setup for this season</div>
      <section id="loadoutize-youtube-panel" aria-label="Loadoutize for this video">
        <div class="loadoutize-heading">
          <img class="loadoutize-logo" src="logo.svg" alt="Loadoutize">
          <span>NO LOADOUT YET</span>
        </div>
        <div class="loadoutize-empty">
          <div class="loadoutize-empty-copy">
            <p class="loadoutize-empty-title">This video's loadout isn't on Loadoutize yet.</p>
          </div>
          <a class="loadoutize-create" href="https://loadoutize.com/create" target="_blank" rel="noopener noreferrer">Create now</a>
        </div>
      </section>
    </main>
  </body>
</html>
